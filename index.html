/* =========================================================
   3D exercise figures (three.js) — built from the same 2-keyframe patterns
   X = forward, Y = up, Z = lateral. SVG stays as fallback.
   ========================================================= */
const T3={inited:false,ok:false,cache:{},queue:[],busy:false};
const SIDE=11;
const CENTER_HOLD=new Set(['goblet','swing','slam','twist','ohtri','abwheel']);
function t3init(){if(T3.inited)return T3.ok;T3.inited=true;
  try{if(!window.THREE)return false;const c=document.createElement('canvas');const gl=c.getContext('webgl')||c.getContext('experimental-webgl');T3.ok=!!gl}catch(e){T3.ok=false}
  return T3.ok}
const cssVar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888888';
function isDarkUI(){const c=new THREE.Color(cssVar('--bg'));return c.r*.3+c.g*.59+c.b*.11<.4}
const G3={};
function t3geo(){if(G3.cyl)return;G3.cyl=new THREE.CylinderGeometry(1,1,1,16);G3.sph=new THREE.SphereGeometry(1,20,14);G3.box=new THREE.BoxGeometry(1,1,1);G3.UP=new THREE.Vector3(0,1,0)}
function t3mats(){const k=(isDarkUI()?'d':'l')+cssVar('--track');if(G3.mk===k)return G3.m;G3.mk=k;const dk=isDarkUI();
  const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c),roughness:.62,metalness:0},o||{}));
  G3.m={body:M(dk?'#C8D1CB':'#E4E0D8'),skin:M(dk?'#D9DED9':'#F1EEE8'),hl:M(cssVar('--track'),{roughness:.5}),
    metal:M(dk?'#9AA39E':'#2B302D',{metalness:.55,roughness:.35}),prop:M(dk?'#3B4741':'#C9CFC8',{roughness:.85}),
    pad:M(dk?'#2B3530':'#3B4540',{roughness:.9}),floor:M(cssVar('--sunk'),{roughness:1}),cable:M(dk?'#7E8A84':'#7A857F'),ball:M(dk?'#8C6B4E':'#6E4E35')};
  return G3.m}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const P3=(p,z)=>V(p.x-100,200-p.y,z||0);

/* joints in 3D for pattern P at time t */
function joints3D(P,t){
  const j=interp(P.f[0],P.f[1],t),o={};
  if(P.front){
    const F=p=>V(0,200-p.y,p.x-100);
    o.hd=F(j.hd);o.nkC=F(j.nk);o.hpC=F(j.hp);o.shR=F(j.sh);o.shL=F(j.sh2);o.hpR=F(j.hr);o.hpL=F(j.hl);
    ['el','wr','kn','an','el2','wr2','kn2','an2'].forEach(k=>{if(j[k])o[k]=F(j[k])});
    o.to=o.an.clone().add(V(11,-1,0));o.to2=o.an2.clone().add(V(11,-1,0));
    o.mirA=false;o.mirL=false;return o}
  if(P.feet!==false){if(!j.to&&j.an)j.to={x:j.an.x+12,y:j.an.y+1};if(!j.to2&&j.an2)j.to2={x:j.an2.x+12,y:j.an2.y+1}}
  o.hd=P3(j.hd);o.nkC=P3(j.sh);o.hpC=P3(j.hp);
  o.shR=P3(j.sh,SIDE);o.shL=P3(j.sh,-SIDE);o.hpR=P3(j.hp,SIDE*.75);o.hpL=P3(j.hp,-SIDE*.75);
  ['el','wr','kn','an','to'].forEach(k=>{if(j[k])o[k]=P3(j[k],k==='kn'||k==='an'||k==='to'?SIDE*.75:SIDE)});
  o.mirA=!j.el2;o.mirL=!j.kn2;
  [['el','el2',SIDE],['wr','wr2',SIDE],['kn','kn2',SIDE*.75],['an','an2',SIDE*.75],['to','to2',SIDE*.75]].forEach(([a,b,z])=>{
    if(j[b])o[b]=P3(j[b],-z);else if(j[a])o[b]=P3(j[a],-z)});
  return o}

function placeSeg(m,a,b,r){const d=new THREE.Vector3().subVectors(b,a),len=d.length()||.001;m.position.copy(a).addScaledVector(d,.5);m.scale.set(r,len,r);m.quaternion.setFromUnitVectors(G3.UP,d.normalize())}

/* build a scene for an exercise; returns {scene,camera,update(t),setCam(theta,phi),theta0} */
function buildScene3D(ex){
  t3geo();const M=t3mats(),P=PAT[ex.pat];
  const scene=new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff,isDarkUI()?0x303834:0x9aa39e,isDarkUI()?.75:.85));
  const dl=new THREE.DirectionalLight(0xffffff,isDarkUI()?.75:.65);dl.position.set(160,320,260);scene.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,.25);dl2.position.set(-200,120,-160);scene.add(dl2);
  const add=(geo,mat)=>{const m=new THREE.Mesh(geo,mat);scene.add(m);return m};
  // floor
  const fl=add(G3.cyl,M.floor);fl.scale.set(98,2,98);fl.position.set(0,13,0);
  // static props
  const box=(x,y,w,h,d,mat,z)=>{const m=add(G3.box,mat||M.prop);m.scale.set(w,h,d||36);m.position.set(x+w/2-100,200-(y+h/2),z||0);return m};
  const rod=(a,b,r,mat)=>{const m=add(G3.cyl,mat||M.metal);placeSeg(m,a,b,r||1.6);return m};
  const slab=(x1,y1,x2,y2,t,d,mat)=>{const a=V(x1-100,200-y1,0),b=V(x2-100,200-y2,0),m=add(G3.box,mat||M.pad);const len=a.distanceTo(b);m.scale.set(len,t,d||34);m.position.copy(a).add(b).multiplyScalar(.5);m.rotation.z=Math.atan2(b.y-a.y,b.x-a.x);return m};
  const dyn=[];
  (P.props||[]).forEach(p=>{const [n,arg]=p.split(':');switch(n){
    case 'bench':box(22,132,104,9,32,M.pad);[34,112].forEach(x=>rod(V(x-100,59,0),V(x-100,14,0),2.2));break;
    case 'incbench':slab(37,92,89,144,9,32);box(80,140,34,8,32,M.pad);rod(V(-4,52,0),V(-4,14,0),2.2);break;
    case 'legbench':box(26,128,128,9,32,M.pad);[40,140].forEach(x=>rod(V(x-100,63,0),V(x-100,14,0),2.2));break;
    case 'htbench':box(22,150,44,35,42,M.pad);break;
    case 'lowbench':box(22,150,40,35,36,M.pad);break;
    case 'rowbench':box(70,146,96,9,32,M.pad);[82,154].forEach(x=>rod(V(x-100,45,0),V(x-100,14,0),2.2));break;
    case 'box':box(108,155,44,30,44);break;
    case 'box2':box(112,152,48,33,48);break;
    case 'seat':box(84,132,40,8,32,M.pad);rod(V(4,60,0),V(4,14,0),2.4);box(124,122,16,7,30,M.pad);break;
    case 'seat2':box(64,132,56,8,36,M.pad);box(60,80,7,52,36,M.pad);rod(V(-8,60,0),V(-8,14,0),2.4);break;
    case 'rowseat':box(48,152,44,8,32,M.pad);rod(V(-30,40,0),V(-30,14,0),2.4);box(136,140,8,24,30);break;
    case 'pullbar':{const y=200-(+arg||28);rod(V(0,y,-52),V(0,y,52),1.8);[-52,52].forEach(z=>rod(V(0,y,z),V(0,14,z),2.4,M.prop));break}
    case 'lowbar':rod(V(-20,130,-52),V(-20,130,52),1.8);[-52,52].forEach(z=>rod(V(-20,130,z),V(-20,14,z),2.4,M.prop));break;
    case 'dipbar':[-17,17].forEach(z=>{rod(V(-26,94,z),V(32,94,z),1.8);rod(V(26,94,z),V(26,14,z),2.4,M.prop)});break;
    case 'hyper':box(72,122,28,9,30,M.pad);box(20,152,18,7,30,M.pad);rod(V(-14,69,0),V(-40,14,0),2.4,M.prop);rod(V(-70,41,0),V(-60,14,0),2.4,M.prop);break;
    case 'wall':box(54,20,6,166,120);break;
    case 'pad':box(84,182,34,5,30,M.pad);box(56,176,12,10,30,M.pad);break;
    case 'post':rod(V(50,160,0),V(50,14,0),2.6,M.prop);break;
    case 'cabletop':{const c=add(G3.cyl,M.cable),h=add(G3.cyl,M.metal);dyn.push(J=>{const w=J.wr.clone();w.z=0;placeSeg(c,V(0,194,0),w,.7);placeSeg(h,V(w.x,w.y,-26),V(w.x,w.y,26),1.6)});rod(V(0,194,-30),V(0,194,30),3,M.prop);break}
    case 'cable':{const a=arg.split(','),pt=V(+a[0]-100,200-(+a[1]),a[2]==='an2'?-SIDE*.75:SIDE),key=a[2]||'wr';const pu=add(G3.sph,M.prop);pu.scale.setScalar(5);pu.position.copy(pt);const c=add(G3.cyl,M.cable);dyn.push(J=>placeSeg(c,pt,J[key],.7));break}
  }});
  // body
  const segDefs=P.front?[
    ['nkC','hpC',9,'torso'],['shL','shR',5.5,'torso'],['hpL','hpR',6.5,'torso']]:[
    ['nkC','hpC',9,'torso'],['shL','shR',5.5,'torso'],['hpL','hpR',6.5,'torso']];
  segDefs.push(['shR','el',5,'arm'],['el','wr',4.2,'arm'],['shL','el2',5,'arm'],['el2','wr2',4.2,'arm'],
    ['hpR','kn',6.6,'leg'],['kn','an',5,'leg'],['an','to',3.6,'leg'],['hpL','kn2',6.6,'leg'],['kn2','an2',5,'leg'],['an2','to2',3.6,'leg']);
  const hl=(P.hl||'').split(' ');
  const mat=c=>hl.includes(c)?M.hl:M.body;
  const segs=segDefs.map(([a,b,r,c])=>({a,b,r,m:add(G3.cyl,mat(c))}));
  const jDefs=[['shR',5.5,'arm'],['shL',5.5,'arm'],['el',5,'arm'],['el2',5,'arm'],['wr',4.6,'arm'],['wr2',4.6,'arm'],['hpR',6.6,'leg'],['hpL',6.6,'leg'],['kn',6.2,'leg'],['kn2',6.2,'leg'],['an',5,'leg'],['an2',5,'leg'],['nkC',9,'torso'],['hpC',9,'torso']];
  const jm=jDefs.map(([k,r,c])=>{const m=add(G3.sph,mat(c));m.scale.setScalar(r);return {k,m}});
  const chest=add(G3.sph,mat('torso')),neck=add(G3.cyl,M.skin),head=add(G3.sph,M.skin);head.scale.setScalar(11);
  // implements
  const imp=resolveImp(P,ex.imp),impParts=[];
  if(imp){
    const center=CENTER_HOLD.has(ex.pat);
    const mk=(kind)=>{const g=new THREE.Group();scene.add(g);
      if(kind==='bar'){const b=new THREE.Mesh(G3.cyl,M.metal);b.scale.set(1.4,104,1.4);b.rotation.x=Math.PI/2;g.add(b);[-1,1].forEach(s=>{const p=new THREE.Mesh(G3.cyl,M.pad);p.scale.set(13,4,13);p.rotation.x=Math.PI/2;p.position.z=s*38;g.add(p);const p2=new THREE.Mesh(G3.cyl,M.pad);p2.scale.set(10,3,10);p2.rotation.x=Math.PI/2;p2.position.z=s*43;g.add(p2)})}
      if(kind==='db'){const h=new THREE.Mesh(G3.cyl,M.metal);h.scale.set(1.3,13,1.3);h.rotation.x=Math.PI/2;g.add(h);[-1,1].forEach(s=>{const p=new THREE.Mesh(G3.cyl,M.pad);p.scale.set(5,4,5);p.rotation.x=Math.PI/2;p.position.z=s*7;g.add(p)})}
      if(kind==='kb'){const b=new THREE.Mesh(G3.sph,M.pad);b.scale.setScalar(7.5);b.position.y=-7;g.add(b);const h=new THREE.Mesh(G3.cyl,M.metal);h.scale.set(1.2,10,1.2);h.rotation.x=Math.PI/2;g.add(h)}
      if(kind==='ball'){const b=new THREE.Mesh(G3.sph,M.ball);b.scale.setScalar(11);b.position.y=-4;g.add(b)}
      if(kind==='wheel'){const w=new THREE.Mesh(G3.cyl,M.pad);w.scale.set(9,6,9);w.rotation.x=Math.PI/2;g.add(w);const a=new THREE.Mesh(G3.cyl,M.metal);a.scale.set(1.2,30,1.2);a.rotation.x=Math.PI/2;g.add(a)}
      return g};
    const hands=[];
    if(imp.at==='wr'){
      if(imp.k==='bar'||center||imp.k==='ball'||imp.k==='wheel')hands.push(J=>{const w=J.wr.clone();w.z=0;return w});
      else{hands.push(J=>J.wr);if(imp.both||!P.front&&joints3D(P,0).mirA)hands.push(J=>J.wr2)}}
    else if(imp.at==='sh')hands.push(J=>J.nkC.clone());
    else if(imp.at==='hp')hands.push(J=>J.hpC.clone());
    hands.forEach(fn=>{const g=mk(imp.k);impParts.push({g,fn})});
  }
  // camera
  const camera=new THREE.PerspectiveCamera(28,1,1,2000);
  const target=V(0,100,0),D=470;
  const setCam=(th,ph,dist)=>{const d=dist||D;camera.position.set(target.x+d*Math.sin(th)*Math.cos(ph),target.y+d*Math.sin(ph),target.z+d*Math.cos(th)*Math.cos(ph));camera.lookAt(target)};
  const update=t=>{const J=joints3D(P,t);
    segs.forEach(s=>{if(J[s.a]&&J[s.b]){s.m.visible=true;placeSeg(s.m,J[s.a],J[s.b],s.r)}else s.m.visible=false});
    jm.forEach(o=>{if(J[o.k]){o.m.visible=true;o.m.position.copy(J[o.k])}else o.m.visible=false});
    const mid=J.nkC.clone().lerp(J.hpC,.32);chest.position.copy(mid);chest.scale.set(11,13,13);
    const d=new THREE.Vector3().subVectors(J.nkC,J.hpC).normalize();chest.quaternion.setFromUnitVectors(G3.UP,d);
    const nb=J.nkC.clone().lerp(J.hd,.55);placeSeg(neck,J.nkC,nb,3.6);head.position.copy(J.hd);
    impParts.forEach(({g,fn})=>{const p=fn(J);g.position.copy(p);if(imp.dx||imp.dy){g.position.x+=imp.dx||0;g.position.y-=imp.dy||0}});
    dyn.forEach(fn=>fn(J))};
  return {scene,camera,update,setCam,theta0:P.front?1.15:.5}
}

/* ---------- thumbnails (rendered once to images) ---------- */
function thumbKey(ex){return (ex.pat||'x')+'|'+(ex.imp||'')}
function t3thumbURL(key){
  const k2=key+'|'+(isDarkUI()?'d':'l')+cssVar('--track');if(T3.cache[k2])return T3.cache[k2];
  if(!T3.tr){T3.tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});T3.tr.setPixelRatio(1);T3.tr.setSize(144,144,false)}
  const [pat,imp]=key.split('|');const sc=buildScene3D({pat,imp:imp||undefined});sc.update(1);sc.camera.aspect=1;sc.camera.updateProjectionMatrix();sc.setCam(sc.theta0,.2,375);
  T3.tr.clear();T3.tr.render(sc.scene,sc.camera);const url=T3.tr.domElement.toDataURL('image/png');T3.cache[k2]=url;return url}
function hydrate3D(){
  if(!t3init())return;
  const els=$$('.t3:not([data-done])');if(!els.length)return;
  const keys=[...new Set(els.map(e=>e.dataset.k))];
  let i=0;const step=()=>{const t0=performance.now();
    while(i<keys.length&&performance.now()-t0<12){const k=keys[i++];if(!PAT[k.split('|')[0]])continue;
      try{const url=t3thumbURL(k);$$(`.t3[data-k="${k}"]:not([data-done])`).forEach(el=>{el.dataset.done='1';el.innerHTML=`<img src="${url}" alt="" draggable="false">`})}catch(e){console.warn('3d thumb',e)}}
    if(i<keys.length)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
let _hydT=null;
new MutationObserver(()=>{if(_hydT)return;_hydT=requestAnimationFrame(()=>{_hydT=null;hydrate3D()})}).observe(document.body,{childList:true,subtree:true});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{$$('.t3[data-done]').forEach(e=>{e.removeAttribute('data-done')});hydrate3D()});

/* ---------- live, rotatable detail view ---------- */
function startAnim3D(el,ex){
  const sc=buildScene3D(ex);
  if(!T3.dr){T3.dr=new THREE.WebGLRenderer({antialias:true,alpha:true})}
  const R=T3.dr,cv=R.domElement;el.innerHTML='';el.appendChild(cv);cv.style.width='100%';cv.style.height='100%';cv.style.touchAction='none';cv.style.cursor='grab';cv.setAttribute('aria-label','תצוגת תלת-ממד: גרור כדי לסובב');cv.setAttribute('role','img');
  const w=el.clientWidth||280;R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.setSize(w,w,false);sc.camera.aspect=1;sc.camera.updateProjectionMatrix();
  const st={el,ex,is3d:true,playing:!reduceMotion,start:performance.now(),raf:0,t:reduceMotion?1:0,theta:sc.theta0,phi:.22};
  const draw=()=>{sc.update(st.t);sc.setCam(st.theta,st.phi);R.render(sc.scene,sc.camera)};
  st.setT=t=>{st.t=t;draw()};
  st.setView=v=>{st.theta={side:0,front:Math.PI/2,q:sc.theta0,back:-Math.PI*.75}[v];st.phi=v==='top'?.9:.22;if(!st.playing)draw()};
  st.tick=now=>{if(!st.playing)return;const ph=((now-st.start)/2800)%1;const u=ph<.12?0:ph<.5?(ph-.12)/.38:ph<.62?1:1-(ph-.62)/.38;st.t=(1-Math.cos(Math.PI*u))/2;draw();st.raf=requestAnimationFrame(st.tick)};
  let drag=null;
  const down=e=>{drag={x:e.clientX,y:e.clientY,th:st.theta,ph:st.phi};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
  const move=e=>{if(!drag)return;st.theta=drag.th-(e.clientX-drag.x)*.012;st.phi=Math.max(-.05,Math.min(1.1,drag.ph+(e.clientY-drag.y)*.008));if(!st.playing)draw()};
  const up=()=>{drag=null;cv.style.cursor='grab'};
  cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  st.cleanup=()=>{cv.removeEventListener('pointerdown',down);cv.removeEventListener('pointermove',move);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up)};
  draw();if(st.playing)st.raf=requestAnimationFrame(st.tick);
  anim=st;
}

/* =========================================================
   One-time sign-up: username + phone (no verification), then the questionnaire
   Stored only in the viewer's own private record (S.user).
   ========================================================= */
const normPhone=s=>String(s||'').replace(/[^\d+]/g,'');
function phoneOk(s){const d=normPhone(s).replace(/^\+/,'');if(/^0[5]\d{8}$/.test(d))return true;if(/^972\d{8,9}$/.test(d))return true;return d.length>=9&&d.length<=15&&/^\d+$/.test(d)}
function fmtPhone(s){const d=normPhone(s);const m=d.match(/^(05\d)(\d{7})$/);return m?`${m[1]}-${m[2]}`:d}
const nameOk=s=>{const t=String(s||'').trim();return t.length>=2&&t.length<=30};
let onb={step:'splash',name:'',phone:'',err:{}};
function showOnb(step){onb.step=step;$('#onb').hidden=false;document.body.style.overflow='hidden';drawOnb()}
function hideOnb(){$('#onb').hidden=true;document.body.style.overflow=''}
function drawOnb(){
  const el=$('#onbIn');
  if(onb.step==='splash'){el.innerHTML=`<div class="onb-hero"><div class="wm big" aria-label="שלי פיט">שלי<b>פיט</b></div><p class="tag">הכושר שלי</p><p class="note">טוען…</p></div>`;return}
  if(onb.step==='welcome'){el.innerHTML=`
    <div class="onb-hero">
      <div class="wm big" aria-label="שלי פיט">שלי<b>פיט</b></div>
      <p class="tag">הכושר שלי. כוח, ריצה וספורט במקום אחד.</p>
    </div>
    <ul class="onb-points">
      <li><b>תוכנית אישית</b><span>8 שאלות, ותוכנית שמתאימה למטרה, לציוד ולזמן שלך</span></li>
      <li><b>יומן אימונים</b><span>סטים, חזרות, שיאים וטבלת שנה צבעונית</span></li>
      <li><b>110 תרגילים בתלת-ממד</b><span>עם הסבר טכניקה וטעויות נפוצות</span></li>
    </ul>
    <button class="btn xl" data-act="onbGo">בואו נתחיל</button>
    <p class="note" style="text-align:center;margin:0">הרשמה חד פעמית, בלי קוד אימות.</p>`;return}
  if(onb.step==='signup'){const e=onb.err;el.innerHTML=`
    <div class="onb-steps"><span class="on">1 · פרטים</span><span>2 · שאלון מטרות</span></div>
    <div><h2 style="font-size:1.7rem">נעים להכיר</h2><p class="note" style="margin:4px 0 0">פעם אחת בלבד. אחר כך נכנסים ישר לאפליקציה.</p></div>
    <form id="onbForm" class="stack" novalidate>
      <label class="fld" for="onbName">שם משתמש<input id="onbName" autocomplete="nickname" maxlength="30" value="${esc(onb.name)}" placeholder="איך לקרוא לך?" class="big3">${e.name?`<span class="ferr">${esc(e.name)}</span>`:''}</label>
      <label class="fld" for="onbPhone">מספר טלפון<input id="onbPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="${esc(onb.phone)}" placeholder="050-1234567" class="big3 num">${e.phone?`<span class="ferr">${esc(e.phone)}</span>`:''}</label>
      <p class="note" style="margin:0">בלי SMS ובלי קוד. הפרטים נשמרים רק ברשומה הפרטית שלך באפליקציה.</p>
      <button class="btn xl" type="submit">המשך לשאלון</button>
    </form>`;
    $('#onbForm').addEventListener('submit',ev=>{ev.preventDefault();onbSubmit()});
    setTimeout(()=>{try{$('#onbName').focus()}catch(_){}},60)}
}
function onbSubmit(){
  onb.name=$('#onbName').value.trim();onb.phone=$('#onbPhone').value.trim();onb.err={};
  if(!nameOk(onb.name))onb.err.name='שם בין 2 ל-30 תווים.';
  if(!phoneOk(onb.phone))onb.err.phone='מספר לא תקין. למשל 050-1234567.';
  if(onb.err.name||onb.err.phone){drawOnb();return}
  S.user={name:onb.name,phone:fmtPhone(onb.phone),joined:new Date().toISOString()};saveState();
  hideOnb();renderAll();
  if(!S.profile){openQuiz();toast(`ברוך הבא, ${S.user.name}! עוד 2 דקות ויש לך תוכנית.`)}
  else toast(`ברוך הבא, ${S.user.name}!`)}
function userGate(){if(S.user){hideOnb();renderAll();return}showOnb('welcome')}

/* account card in the goals tab */
function userCard(){if(!S.user)return '';const u=S.user;
  return `<div class="card between"><div class="row" style="gap:12px;flex-wrap:nowrap;min-width:0"><span class="avatar" aria-hidden="true">${esc(u.name.trim().charAt(0))}</span><div style="min-width:0"><b>${esc(u.name)}</b><div class="note num" style="direction:ltr;text-align:right">${esc(u.phone)}</div><div class="note">הצטרפת ב-${esc(fmtDateY(u.joined))}</div></div></div><button class="btn soft sm" data-act="userEdit">ערוך פרטים</button></div>`}
function openUserEdit(){const u=S.user||{};onb.err={};
  openSheet(`<div class="shead"><div class="tt"><h2>הפרטים שלי</h2></div><button class="ibtn" data-act="close" aria-label="סגור">✕</button></div>
   <label class="fld" for="ueName">שם משתמש<input id="ueName" maxlength="30" value="${esc(u.name||'')}" class="big3"></label>
   <label class="fld" for="uePhone">מספר טלפון<input id="uePhone" type="tel" inputmode="tel" dir="ltr" value="${esc(u.phone||'')}" class="big3 num"></label>
   <div id="ueErr" class="ferr"></div>
   <button class="btn xl" data-act="userSave">שמור</button>`)}
Object.assign(ACT,{
  onbGo:()=>showOnb('signup'),
  userEdit:()=>openUserEdit(),
  userSave:()=>{const n=$('#ueName').value.trim(),p=$('#uePhone').value.trim();
    if(!nameOk(n)){$('#ueErr').textContent='שם בין 2 ל-30 תווים.';return}if(!phoneOk(p)){$('#ueErr').textContent='מספר לא תקין. למשל 050-1234567.';return}
    S.user=Object.assign({},S.user,{name:n,phone:fmtPhone(p)});saveState();closeSheet();renderAll();toast('הפרטים נשמרו')}
});

/* init */
renderTools();
let t0='today';try{t0=localStorage.getItem('maslul2.tab')||'today'}catch(e){}
const hsh=(location.hash||'').slice(1);if(['today','programs','lib','progress','tools'].includes(hsh))t0=hsh;
if(A)t0='today';
showTab(t0);
if(A)requestWake();
if(!S.user)showOnb('splash');
Promise.race([Cloud.init(),new Promise(r=>setTimeout(r,3500))]).then(userGate,userGate);

})();
</script>
