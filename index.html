<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C4472F">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>שלי פיט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: light gym-app shell — slim top bar, fixed bottom lane-nav with big targets, card stacks; track-red reserved for the one primary action per screen */
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --sunk:#EEF0EB; --line:#E2E6E0; --ink:#17201C; --muted:#64706A;
  --track:#C4472F; --track-soft:#FBEAE5; --lane:#2C7357; --lane-soft:#E2F0E9;
  --good:#2E7D4F; --warn:#B7791F; --bad:#B23A3A; --scrim:rgba(20,26,23,.42);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --navh:64px; --r:14px;
  /* workout-type colors: 4 hues validated all-pairs (CVD + normal vision) + neutral for "other" */
  --c-up:#2a78d6; --c-low:#e87ba4; --c-full:#008300; --c-cardio:#eda100; --c-other:#A9B1AC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#18201C; --sunk:#202A25; --line:#29342F; --ink:#E8EDE9; --muted:#9AA8A0;
  --track:#E36B52; --track-soft:#3A231D; --lane:#63B894; --lane-soft:#1B3229;
  --good:#5CC48A; --warn:#E0A84A; --bad:#E07070; --scrim:rgba(0,0,0,.6);
  --c-up:#3987e5; --c-low:#d55181; --c-full:#008300; --c-cardio:#c98500; --c-other:#56625B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201C; --sunk:#202A25; --line:#29342F; --ink:#E8EDE9; --muted:#9AA8A0;
  --track:#E36B52; --track-soft:#3A231D; --lane:#63B894; --lane-soft:#1B3229;
  --good:#5CC48A; --warn:#E0A84A; --bad:#E07070; --scrim:rgba(0,0,0,.6);
  --c-up:#3987e5; --c-low:#d55181; --c-full:#008300; --c-cardio:#c98500; --c-other:#56625B; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--navh) + 110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.35rem} h3{font-size:1.08rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.muted{color:var(--muted)} .note{font-size:.86rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:grid;gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.55rem;color:var(--ink)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--track);display:grid;place-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud i{background:var(--good)} .sync.err i{background:var(--warn)}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--navh)}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:700;cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;padding:0;border-radius:999px}
.nav button .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
.nav button[aria-selected="true"]{color:var(--track)}
.nav button[aria-selected="true"] .ic{background:var(--track-soft)}
.nav .live{position:absolute;top:8px;inset-inline-start:calc(50% + 12px);width:9px;height:9px;border-radius:50%;background:var(--track);border:2px solid var(--surface)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.eyebrow{font-size:.74rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.g{background:var(--lane-soft);color:var(--lane)} .chip.t{background:var(--track-soft);color:var(--track)} .chip.pr{background:var(--warn);color:#fff}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:12px;padding:0 18px;background:var(--track);color:#fff;font-weight:800;font-size:1rem;cursor:pointer;line-height:1.15;text-align:center}
.btn.xl{min-height:58px;width:100%;font-size:1.12rem}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.lane{background:var(--lane)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--bad)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.dash{background:transparent;border:2px dashed var(--line);color:var(--muted);width:100%}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;font-size:1.1rem;font-weight:800;color:var(--muted);flex:none}
.link{background:none;border:0;padding:4px 0;color:var(--lane);font-weight:800;cursor:pointer}

input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
input[type=range]{min-height:32px;padding:0;accent-color:var(--track);border:0;background:transparent}
label.fld{display:grid;gap:5px;font-weight:700;font-size:.9rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* chips scroller */
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sm{min-height:36px;padding:0 12px;font-size:.84rem}

/* today */
.week{display:flex;gap:6px;align-items:center}
.week i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.week i.on{background:var(--lane);border-color:var(--lane)}
.next h2{font-size:1.7rem}
.exl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:760px){.exl{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px}}
.exl li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.exl .th{width:40px;height:40px;flex:none;border-radius:9px;background:var(--sunk)}
.exl .th svg{width:100%;height:100%}
.exl .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exl .nm small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.exl .rx{font-family:var(--f-num);font-size:.85rem;color:var(--muted);direction:ltr;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:var(--f-num);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--muted);font-weight:700}
.hist{display:grid;gap:0}
.hist .r{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist .r:last-child{border-bottom:0}

/* logger */
.lhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:25;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px}
.lhead .t{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.lhead .ttl{flex:1;min-width:0}
.lhead .ttl b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .ttl small{opacity:.75;font-size:.8rem}
.lhead .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--bg)}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--lane);transition:width .3s}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;min-width:0}
.item.complete{border-color:var(--lane)}
.ih{display:flex;align-items:center;gap:10px}
.ih .th{width:52px;height:52px;flex:none;border-radius:10px;background:var(--sunk);border:0;padding:0;cursor:pointer}
.ih .th svg{width:100%;height:100%}
.ih .nm{flex:1;min-width:0;text-align:right;background:none;border:0;padding:0;cursor:pointer}
.ih .nm b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.2}
.ih .nm small{color:var(--muted);font-size:.82rem}
.imenu{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--sunk);border-radius:12px}
.prev{font-size:.86rem;color:var(--muted)} .prev b{color:var(--ink);font-weight:700}
.sugg{font-size:.86rem;color:var(--lane);font-weight:800}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1.15fr) minmax(0,1fr) 52px;gap:6px;align-items:center;padding:2px;border-radius:12px}
.set.h{font-size:.74rem;color:var(--muted);font-weight:800;text-align:center;padding-block:0}
.set .sn{height:48px;border:0;background:none;font-family:var(--f-num);font-weight:600;color:var(--muted);cursor:pointer;padding:0}
.set .sn.w{color:var(--warn)}
.stp{display:flex;align-items:stretch;direction:ltr;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-width:0;height:48px}
.stp button{width:34px;flex:none;border:0;background:var(--sunk);font-size:1.2rem;font-weight:800;color:var(--ink);cursor:pointer}
.stp input{border:0;border-radius:0;min-height:0;height:100%;text-align:center;font-family:var(--f-num);font-weight:600;font-size:1.05rem;padding:0 2px;min-width:0;background:transparent}
.set .ok{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.25rem;font-weight:800;color:var(--muted)}
.set.done{background:var(--lane-soft)}
.set.done .stp{border-color:transparent;background:transparent}
.set.done .stp button{visibility:hidden}
.set.done .ok{background:var(--lane);border-color:var(--lane);color:#fff}
.isum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

.restbar{position:fixed;inset-inline:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:45;padding:0 12px 8px}
.restbar .in{max-width:640px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.restbar .t{font-family:var(--f-num);font-size:1.6rem;font-weight:600;min-width:72px}
.restbar .bar{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.restbar .bar span{display:block;height:100%;background:var(--track);transition:width .25s linear}
.restbar button{min-height:44px;min-width:48px;background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--bg);border-radius:10px;font-weight:800;cursor:pointer}

/* library */
.search{position:relative}
.search input{padding-inline-start:42px;min-height:52px;font-size:1.02rem}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.ghead{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.ghead h3{font-size:1.15rem}
.exrow{display:flex;align-items:center;gap:12px;width:100%;min-height:78px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:right}
.exrow:hover{border-color:var(--lane)}
.exrow .th{width:60px;height:60px;flex:none;border-radius:10px;background:var(--sunk)}
.exrow .th svg{width:100%;height:100%}
.exrow .tx{flex:1;min-width:0;display:grid;gap:3px}
.exrow .tx b{font-size:1.02rem;line-height:1.2}
.exrow .tx small{color:var(--muted);font-size:.78rem;direction:ltr;text-align:right;font-family:var(--f-num)}
.exrow .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lvl{display:inline-flex;gap:2px;align-items:center}
.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line)} .lvl i.on{background:var(--track)}
.exrow .pr{font-family:var(--f-num);font-size:.8rem;color:var(--lane);font-weight:600;text-align:center;flex:none;direction:ltr}
.exrow .pr small{display:block;font-family:var(--f-body);color:var(--muted);font-weight:700;font-size:.68rem}

/* sheet */
.sheet{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;grid-template-columns:minmax(0,820px);justify-content:center;align-items:end}
@media (min-width:760px){.sheet{align-items:center;padding:20px}}
.sheet .pnl{background:var(--bg);color:var(--ink);border-radius:20px 20px 0 0;width:100%;max-height:94vh;max-height:94dvh;overflow:auto;display:grid;align-content:start;gap:12px;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet .pnl{border-radius:20px;max-height:90vh}}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.shead .tt{flex:1;min-width:0}
.shead h2{font-size:1.45rem}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.tabs2 button{min-height:42px;border:0;border-radius:9px;background:none;font-weight:800;color:var(--muted);cursor:pointer}
.tabs2 button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tech{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:680px){.tech{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;aspect-ratio:1/1;max-width:100%;max-height:300px;margin-inline:auto;width:100%}
@media (max-width:680px){.stage{max-width:280px}}
.stage svg{width:100%;height:100%;display:block}
.stagectl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;max-width:300px;margin-inline:auto}
.stagectl button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:800;cursor:pointer}
.stagectl button[aria-pressed="true"]{border-color:var(--track);color:var(--track)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.facts span{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.facts b{font-size:.92rem}
.tl{margin:4px 0 0;padding-inline-start:20px;display:grid;gap:4px}
ol.tl li::marker{font-family:var(--f-num);color:var(--track);font-weight:600}
.tl.bad li::marker{color:var(--bad)}
.musc{display:flex;flex-wrap:wrap;gap:6px}

/* programs */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:grid;gap:8px;align-content:start}
.pcard.active{border-color:var(--track);box-shadow:inset 0 4px 0 var(--track)}
.pcard p{margin:0;font-size:.88rem;color:var(--muted)}
.dayed{display:grid;gap:8px}
.exed{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.exed .top{display:flex;align-items:center;gap:10px}
.exed .top .th{width:40px;height:40px;border-radius:8px;background:var(--sunk);flex:none}
.exed .top .th svg{width:100%;height:100%}
.exed .top b{flex:1;min-width:0}
.exed .ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px}
.exed .ctl label{display:grid;gap:3px;font-size:.74rem;font-weight:800;color:var(--muted)}
.rr{display:flex;gap:4px;align-items:center;direction:ltr}
.rr input{text-align:center;padding:4px;font-family:var(--f-num)}
.exed select{padding:4px 8px}
.exed .acts{display:flex;gap:6px;justify-content:flex-start}

/* picker list */
.plist2{display:grid;gap:6px}

/* progress */
.chart{width:100%;height:auto;display:block}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:440px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;color:var(--muted);font-weight:800}
details.wk{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.wk summary{cursor:pointer;padding:12px 14px;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;list-style:none}
details.wk summary::-webkit-details-marker{display:none}
details.wk[open] summary{border-bottom:1px solid var(--line)}
details.wk .body{padding:12px 14px;display:grid;gap:8px}
.hm{display:grid;grid-template-columns:auto repeat(12,minmax(0,1fr));gap:3px;align-items:center;font-size:.7rem;color:var(--muted)}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--sunk);max-width:100%}
.hm i.today{outline:2px solid var(--ink);outline-offset:-1px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.alert{padding:10px 12px;border-radius:10px;background:var(--track-soft);font-size:.92rem}
.toast{position:fixed;bottom:calc(var(--navh) + 84px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:80;text-align:center;font-weight:700}
.slider{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.slider .l{font-weight:700;font-size:.9rem}
.slider input{grid-column:1 / -1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative;display:flex;align-items:center;min-height:42px;font-weight:700;font-size:.9rem;padding:0 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.seg label:has(input:checked){border-color:var(--track);background:var(--track-soft);color:var(--track)}
/* types, questionnaire, year grid */
.tdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle;flex:none}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.cols3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols3>:first-child{grid-column:1 / -1}}
.cols3 .btn{padding:0 8px;font-size:.95rem}
.quizcta{border-color:var(--track);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--surface);box-shadow:inset 0 4px 0 var(--track)}
.qopts{display:grid;gap:8px}
.qopts.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.qopts.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.qopts.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.qopts.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:420px){.qopts.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.qopts.g5{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qopt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;padding:10px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:right;font-size:1.05rem}
.qopt.sm{min-height:50px;font-size:.95rem;padding:8px 10px;justify-content:flex-start}
.qopt.num{justify-content:center;font-family:var(--f-num);font-size:1.15rem}
.qopt b{display:block;font-weight:800}
.qopt small{display:block;color:var(--muted);font-size:.84rem;font-weight:400;margin-top:2px;font-family:var(--f-body)}
.qopt[aria-pressed="true"]{border-color:var(--track);background:var(--track-soft)}
.qchk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;color:transparent;flex:none}
.qopt[aria-pressed="true"] .qchk{background:var(--track);border-color:var(--track);color:#fff}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.yscroll{overflow-x:auto;padding-bottom:4px}
.ygrid{display:block}
.ygrid .yc{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.86rem;cursor:pointer}
.lg b{margin-inline-start:6px;color:var(--muted)}
.lg[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend.static .lg{min-height:30px;cursor:default;border:0;padding:0 8px 0 0;background:none;font-size:.8rem;color:var(--muted)}
.daydet{display:grid;gap:6px;padding:10px 12px;background:var(--sunk);border-radius:12px}
.stp.big{height:52px}.stp.big button{width:48px}
.tbars{display:grid;gap:8px}
.tb{display:grid;grid-template-columns:120px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:.86rem}
.tb .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;display:block}
.tb .track span{display:block;height:100%;border-radius:0 6px 6px 0}
.pill .tdot{margin-inline-end:6px}
/* review, weekly goals, physical goals, volume, supersets */
.review{border-color:var(--lane);box-shadow:inset 0 4px 0 var(--lane)}
.sug.good{border-inline-start:4px solid var(--good)}.sug.warn{border-inline-start:4px solid var(--warn)}.sug.bad{border-inline-start:4px solid var(--bad)}
.sug{display:grid;gap:6px}
.chip.st-good{background:var(--good);color:#fff}.chip.st-warn{background:var(--warn);color:#fff}.chip.st-bad{background:var(--bad);color:#fff}
.wgoals{display:grid;gap:8px}
.wg{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center}
.wg .lbl{font-weight:700}
.wg .pips{display:flex;gap:5px;flex-wrap:wrap}
.wg .pips i{width:22px;height:22px;border-radius:7px;background:var(--sunk);border:1px solid var(--line)}
.wg .pips i.on{background:var(--lane);border-color:var(--lane)}
.wg .pips i.extra{opacity:.6}
.wg.ok b{color:var(--good)}
.card.met{border-color:var(--good);box-shadow:inset 0 4px 0 var(--good)}
.gbar{display:inline-block;width:14px;height:5px;border-radius:2px;background:var(--good);margin-inline-end:6px}
.lg.goal{cursor:default}
.pg{display:grid;gap:8px}.pg.done{border-color:var(--good)}
.big2{font-size:1.5rem;font-weight:600}
.vbars{display:grid;gap:8px}
.vb{display:grid;grid-template-columns:86px minmax(0,1fr) 34px 64px;gap:8px;align-items:center;font-size:.86rem}
.vb .lbl{font-weight:700}
.vb .track{position:relative;height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;display:block}
.vb .band{position:absolute;top:0;bottom:0;background:var(--lane-soft);border-inline:1px dashed var(--lane)}
.vb .val{position:absolute;top:3px;bottom:3px;inset-inline-start:0;border-radius:4px}
.vb .val.st-good{background:var(--good)}.vb .val.st-warn{background:var(--warn)}.vb .val.st-bad{background:var(--bad)}
.vb .chip{justify-content:center}
@media (max-width:420px){.vb{grid-template-columns:72px minmax(0,1fr) 30px 58px}}
.item.ss{border-inline-start:5px solid var(--track)}
.sshead{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--track)}
.sstag{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--track);color:#fff;font-size:.8rem;flex:none}
.exl li.ssli{border-inline-start:3px solid var(--track);padding-inline-start:6px}
.recpair{display:grid;gap:2px;text-align:right;padding:12px 14px;border:2px solid var(--track);border-radius:14px;background:var(--track-soft);cursor:pointer;min-height:64px}
.recpair b{font-size:1.15rem;font-family:var(--f-display);font-weight:400}
.recpair small{color:var(--muted);font-weight:700}
.t3{display:block;width:100%;height:100%}.t3 img,.t3 svg{width:100%;height:100%;display:block;object-fit:contain}
.stage canvas{display:block;border-radius:14px}
/* brand + onboarding */
.wm{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;color:var(--ink);line-height:1}
.wm b{font-weight:400;color:var(--track);margin-inline-start:2px}
.brand h1.wm{font-size:1.6rem}
.wm.big{font-size:clamp(3.2rem,16vw,4.6rem)}
.onb{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.onb::before{content:"";position:fixed;inset-inline:0;top:0;height:42vh;background:repeating-linear-gradient(180deg,transparent 0 22px,color-mix(in srgb,var(--track) 14%,transparent) 22px 24px);-webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent);pointer-events:none}
.onb-in{position:relative;max-width:460px;margin:0 auto;display:grid;gap:18px;min-height:100%;align-content:center}
.onb-hero{text-align:center;display:grid;gap:6px;padding-block:20px 6px}
.onb-hero .tag{margin:0;font-size:1.15rem;font-weight:700;color:var(--muted)}
.onb-points{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.onb-points li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px;border-inline-start:4px solid var(--track)}
.onb-points span{color:var(--muted);font-size:.92rem}
.onb-steps{display:flex;gap:8px}
.onb-steps span{flex:1;text-align:center;padding:8px;border-radius:999px;background:var(--sunk);font-size:.84rem;font-weight:800;color:var(--muted)}
.onb-steps span.on{background:var(--track);color:#fff}
input.big3{min-height:56px;font-size:1.15rem}
.ferr{color:var(--bad);font-size:.86rem;font-weight:700}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--track);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;flex:none}
footer{margin-top:24px;font-size:.8rem;color:var(--muted);max-width:70ch}
@media (prefers-reduced-motion:reduce){.restbar .bar span,.prog span{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';
/* =========================================================
   Exercise database
   X(id, he, en, group, equipment, pattern, level, primary, secondary, setup, steps, mistakes, opts)
   lists: primary/secondary comma-separated; setup/steps/mistakes '|' separated
   opts: unit ('reps'|'sec'|'m'), imp (implement override 'db'|'bar'|'kb'|'none'|'bar@sh'), iso, breath
   ========================================================= */
const BR='שאיפה ונעילת בטן לפני החזרה, נשיפה בחלק המאומץ';
const G={CH:'חזה',BK:'גב',SH:'כתפיים',BI:'יד קדמית',TR:'יד אחורית',QD:'ארבע ראשי',HM:'ירך אחורית',GL:'ישבן',CF:'שוקיים',AB:'בטן',FB:'גוף מלא'};
const GROUP_ORDER=[G.CH,G.BK,G.SH,G.BI,G.TR,G.QD,G.HM,G.GL,G.CF,G.AB,G.FB];
const EQUIP=['מוט','משקולות','קטלבל','מכונה','כבל','משקל גוף','גומייה','כדור כוח'];
const LVL=['','מתחיל','בינוני','מתקדם'];
const INC={'מוט':2.5,'משקולות':2,'קטלבל':4,'מכונה':5,'כבל':2.5,'משקל גוף':0,'גומייה':0,'כדור כוח':0};
const sp=(s,d)=>s?s.split(d).map(x=>x.trim()).filter(Boolean):[];
function X(id,he,en,m,eq,pat,lvl,prim,sec,setup,steps,bad,o){o=o||{};
  return {id,he,en,m,eq,pat,lvl,prim:sp(prim,','),sec:sp(sec,','),setup:sp(setup,'|'),steps:sp(steps,'|'),bad:sp(bad,'|'),
    unit:o.unit||'reps',bw:eq==='משקל גוף'||eq==='גומייה',inc:o.inc!=null?o.inc:INC[eq],imp:o.imp,iso:!!o.iso,breath:o.breath||BR}}
const EX=[
/* ---------- חזה ---------- */
X('bench','לחיצת חזה במוט','Bench Press',G.CH,'מוט','bench',2,'חזה','כתף קדמית,יד אחורית',
 'העיניים מתחת למוט|שכמות מכונסות ומטה, קשת קלה בגב העליון|כפות רגליים יציבות על הרצפה',
 'הוצאת המוט מעל הכתפיים|ירידה מבוקרת לקו הפטמות, מרפקים בכ-45–70° מהגוף|נגיעה קלה בחזה בלי קפיצה|דחיפה למעלה ומעט לכיוון הפנים',
 'מרפקים פתוחים ל-90°|הישבן מתרומם מהספסל|המוט קופץ מהחזה',{breath:'שאיפה בירידה, נשיפה אחרי הנקודה הקשה'}),
X('incbench','לחיצת חזה בשיפוע במוט','Incline Bench Press',G.CH,'מוט','incline',2,'חזה עליון','כתף קדמית,יד אחורית',
 'ספסל בשיפוע 30–45°|שכמות מכונסות, כפות רגליים יציבות',
 'הורדת המוט לחזה העליון, מתחת לעצם הבריח|מרפקים בכ-60° מהגוף|דחיפה ישרה למעלה',
 'שיפוע תלול מדי שהופך את התרגיל לכתפיים|הישבן מתרומם|המוט נוחת נמוך מדי',{imp:'bar'}),
X('dbbench','לחיצת חזה במשקולות','Dumbbell Bench Press',G.CH,'משקולות','bench',1,'חזה','כתף קדמית,יד אחורית',
 'משקולות על הירכיים, שכיבה והעלאה לגובה החזה|שכמות מכונסות',
 'דחיפה למעלה עד שהמשקולות כמעט נוגעות|ירידה מבוקרת לגובה החזה עם מתיחה|מרפקים בכ-45–60°',
 'ירידה עמוקה מדי עם כאב בכתף|משקולות מתנדנדות בלי שליטה',{imp:'db'}),
X('incdb','לחיצת משקולות בשיפוע','Incline DB Press',G.CH,'משקולות','incline',1,'חזה עליון','כתף קדמית,יד אחורית',
 'ספסל בשיפוע של כ-30°|משקולות מעל החזה העליון, שכמות מכונסות',
 'ירידה עד שהמשקולות בגובה החזה|מרפקים בכ-45° מהגוף|דחיפה למעלה והתקרבות קלה של המשקולות',
 'שיפוע גבוה מדי שהופך את התרגיל לכתפיים|שחרור השכמות בדחיפה'),
X('declbench','לחיצת חזה בשיפוע שלילי','Decline Bench Press',G.CH,'מוט','bench',2,'חזה תחתון','יד אחורית,כתף קדמית',
 'רגליים נעולות בתומך, שיפוע שלילי קל|עזרה בהוצאת המוט',
 'ירידה לחזה התחתון|דחיפה למעלה בקו ישר',
 'קפיצת המוט מהחזה|הראש מתרומם מהספסל'),
X('chestpress','לחיצת חזה במכונה','Machine Chest Press',G.CH,'מכונה','bench',1,'חזה','כתף קדמית,יד אחורית',
 'גובה מושב שבו הידיות בגובה אמצע החזה|גב צמוד למשענת',
 'דחיפה עד יישור כמעט מלא|חזרה איטית עד מתיחה בחזה',
 'הכתפיים נשלפות קדימה|נעילת מרפקים חזקה',{imp:'none'}),
X('dbfly','פרפר במשקולות','Dumbbell Fly',G.CH,'משקולות','fly',2,'חזה','כתף קדמית',
 'שכיבה על ספסל, משקולות מעל החזה|מרפקים מכופפים מעט ונשארים קבועים',
 'פתיחה רחבה לצדדים עד מתיחה בחזה|חזרה בתנועת "חיבוק" עד מעל החזה',
 'יישור מרפקים מלא|ירידה עמוקה מדי|משקל כבד שהופך את התרגיל ללחיצה',{iso:true}),
X('cablefly','קרוסאובר בכבלים','Cable Crossover',G.CH,'כבל','fly',2,'חזה','כתף קדמית',
 'גלגלות בגובה הכתפיים, צעד קדימה|גו מעט קדימה, מרפקים מכופפים מעט',
 'הבאת הידיים יחד לפני החזה בקשת|כיווץ של שנייה|חזרה מבוקרת עד מתיחה',
 'משיכה בזרועות במקום קשת|הגוף נמשך אחורה עם הכבלים',{iso:true}),
X('pecdeck','פק דק','Pec Deck',G.CH,'מכונה','fly',1,'חזה','כתף קדמית',
 'ידיות בגובה הכתפיים|גב צמוד למשענת',
 'סגירת הידיים לפני החזה|חזרה איטית עד מתיחה',
 'הכתפיים מתרוממות|טווח קצר',{iso:true}),
X('pushup','שכיבות סמיכה','Push-Up',G.CH,'משקל גוף','pushup',1,'חזה','יד אחורית,כתף קדמית,ליבה',
 'כפות ידיים מעט רחבות מהכתפיים|גוף בקו ישר מהראש לעקבים',

const LS={get(k,d){try{const v=localStorage.getItem('maslul2.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('maslul2.'+k,JSON.stringify(v))}catch(e){}}};
const DEF_S={programs:[],activeProgramId:'tpl-full3',dayPtr:{},custom:[],settings:{sound:true},updated:0};
let S=Object.assign(clone(DEF_S),LS.get('state',{}));
let W=LS.get('workouts',[]);
let A=LS.get('active',null);
const sortW=()=>W.sort((a,b)=>b.date<a.date?-1:1);

function setSync(mode){const el=$('#sync');el.className='sync '+(mode||'');
  $('#syncTxt').textContent=mode==='cloud'?'מסונכרן לחשבון':mode==='err'?'נשמר במכשיר בלבד':'נשמר במכשיר'}
const Cloud={on:false,chain:{},
  run(key,fn){if(!this.on)return Promise.resolve();
    const p=(this.chain[key]||Promise.resolve()).then(fn).then(()=>setSync('cloud')).catch(e=>{console.warn('save',e);setSync('err');if(e&&e.code==='quota_exceeded')toast('אין מקום פנוי באחסון. מחק אימונים ישנים כדי להמשיך לשמור.')});
    this.chain[key]=p;return p},
  async init(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const id=await user.id();if(!id)return;
      this.root=db.doc('data/users/'+id+'/state');this.act=db.doc('data/users/'+id+'/active');this.col=this.root.collection('workouts');
      const [st,ws,ac]=await Promise.all([this.root.get(),this.col.get(),this.act.get()]);
      this.on=true;
      if(st.exists){const rs=clone(st.data());if((rs.updated||0)>=(S.updated||0))S=Object.assign(clone(DEF_S),rs);else this.run('state',()=>this.root.set(clone(S)))}
      else if(S.updated)this.run('state',()=>this.root.set(clone(S)));
      const remote=new Map(ws.docs.map(d=>[d.id,clone(d.data())]));
      for(const w of W)if(!remote.has(w.id)){const c=clone(w);this.run('w'+w.id,()=>this.col.doc(w.id).set(c))}
      const merged=new Map(W.map(w=>[w.id,w]));for(const [k,v] of remote)merged.set(k,v);
      W=[...merged.values()];sortW();
      const ra=ac.exists&&ac.data().w?clone(ac.data().w):null;
      if(ra&&(!A||(ra.updated||0)>(A.updated||0)))A=ra;
      else if(A&&(!ra||(A.updated||0)>(ra.updated||0))){const c=clone(A);this.run('active',()=>this.act.set({w:c}))}
      LS.set('state',S);LS.set('workouts',W);LS.set('active',A);
      setSync('cloud');renderAll();
    }catch(e){console.warn('cloud init',e);this.on=false;setSync('local')}
  }
};
const deb={};
function debounce(k,fn,ms){clearTimeout(deb[k]);deb[k]=setTimeout(()=>{delete deb[k];fn()},ms)}
const FL={
  state:()=>Cloud.run('state',()=>Cloud.root.set(clone(S))),
  active:()=>{const c=A?clone(A):null;Cloud.run('active',()=>c?Cloud.act.set({w:c}):Cloud.act.delete())}
};
function flushAll(){for(const k in deb){clearTimeout(deb[k]);delete deb[k];FL[k]&&FL[k]()}}
function saveState(){S.updated=Date.now();LS.set('state',S);debounce('state',FL.state,700)}
function saveActive(now){if(A)A.updated=Date.now();LS.set('active',A);if(now){clearTimeout(deb.active);delete deb.active;FL.active()}else debounce('active',FL.active,900)}
function saveWorkout(w){LS.set('workouts',W);const c=clone(w);Cloud.run('w'+w.id,()=>Cloud.col.doc(w.id).set(c))}
function deleteWorkout(id){W=W.filter(w=>w.id!==id);LS.set('workouts',W);Cloud.run('w'+id,()=>Cloud.col.doc(id).delete())}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll()});

/* =========================================================
   Data helpers
   ========================================================= */
const allPrograms=()=>[...TPL,...S.programs];
const getProg=id=>allPrograms().find(p=>p.id===id)||null;
const allEx=()=>[...EX,...S.custom.map(c=>Object.assign({lvl:1,prim:[],sec:[],setup:[],steps:[],bad:[]},c,{custom:true}))];
const exGet=id=>EXM[id]||allEx().find(c=>c.id===id)||{id,he:'תרגיל שנמחק',m:'משלי',eq:'',custom:true,prim:[],sec:[]};
const unitOf=ex=>ex.unit||'reps';
function history(exId){const out=[];for(const w of W)for(const it of w.items){if(it.exId!==exId)continue;
  const sets=it.sets.filter(s=>s.done&&s.type!=='w'&&+s.reps>0);if(sets.length)out.push({date:w.date,sets})}return out}
function sessionBest(sets,ex){
  if(unitOf(ex)!=='reps'||(ex.bw&&!sets.some(s=>+s.kg>0)))return {val:Math.max(...sets.map(s=>+s.reps)),kind:'reps'};
  let best=0;for(const s of sets){const v=e1rm(+s.kg,+s.reps);if(v>best)best=v}return {val:best,kind:'e1rm'}}
function exRecords(exId){
  const ex=exGet(exId),h=history(exId);if(!h.length)return null;
  let bestE=0,bestSet=null,bestDate=null,maxReps=0;
  for(const s of h)for(const x of s.sets){const v=e1rm(+x.kg,+x.reps);if(v>bestE){bestE=v;bestSet=x;bestDate=s.date}if(+x.reps>maxReps)maxReps=+x.reps}
  return {ex,bestE,bestSet,bestDate,maxReps,sessions:h.length,last:h[0]}}
const volOf=w=>w.items.reduce((a,it)=>a+it.sets.reduce((b,s)=>b+(s.done&&s.type!=='w'?(+s.kg||0)*(+s.reps||0):0),0),0);
const setsOf=w=>w.items.reduce((a,it)=>a+it.sets.filter(s=>s.done&&s.type!=='w').length,0);
function setLabel(s,ex){return (+s.kg?fmtKg(s.kg)+'×':'')+(+s.reps)+UNIT_S[unitOf(ex)]}
const rxLabel=(x,ex)=>`${x.sets}×${x.min===x.max?x.min:x.min+'–'+x.max}${UNIT_S[unitOf(ex)]}`;
function prLabel(r){if(!r)return '';return r.bestE?`${Math.round(r.bestE)}<small>1RM</small>`:`${r.maxReps}<small>שיא</small>`}
function suggestion(it){
  const ex=exGet(it.exId),h=history(it.exId);if(!h.length)return null;
  const last=h[0].sets,top=Math.max(...last.map(s=>+s.kg||0));
  const work=last.filter(s=>(+s.kg||0)===top);
  const hitAll=work.length>=it.target.sets&&work.every(s=>+s.reps>=it.target.max);
  if(!ex.inc||top<=0)return {kg:top||'',note:hitAll?'הגעת ליעד העליון: נסה עוד חזרה או משקל נוסף':null};
  if(hitAll)return {kg:top+ex.inc,note:`עמדת בטווח העליון בכל הסטים: עלייה ל-${fmtKg(top+ex.inc)} ק"ג`};
  return {kg:top,note:null}}
function weekStreak(){if(!W.length)return 0;let n=0,ws=weekStart(new Date());
  const has=d=>W.some(w=>{const x=new Date(w.date);return x>=d&&x<new Date(d.getTime()+7*864e5)});
  if(!has(ws))ws=new Date(ws.getTime()-7*864e5);while(has(ws)){n++;ws=new Date(ws.getTime()-7*864e5)}return n}

function finishSummary(){
  const done=A.items.reduce((a,it)=>a+it.sets.filter(s=>s.done).length,0),undone=A.items.reduce((a,it)=>a+it.sets.filter(s=>!s.done).length,0);
  const prs=[];for(const it of A.items){const ex=exGet(it.exId);const sets=it.sets.filter(s=>s.done&&s.type!=='w'&&+s.reps>0);if(!sets.length)continue;
    const h=history(it.exId);if(!h.length)continue;const cur=sessionBest(sets,ex),prev=Math.max(...h.map(x=>sessionBest(x.sets,ex).val));
    if(cur.val>prev+.01)prs.push({ex,cur,prev})}
  return {done,undone,prs}}

  const f=finishSummary(),dur=(Date.now()-new Date(A.date).getTime())/1000;
  openSheet(`<div class="shead"><div class="tt"><h2>סיום אימון</h2></div><button class="ibtn" data-act="close" aria-label="סגור">✕</button></div>
   <div class="stats"><div class="stat"><div class="k">משך</div><div class="v num">${fmtDur(dur)}</div></div>
   <div class="stat"><div class="k">סטים</div><div class="v num">${f.done}</div></div>
   <div class="stat"><div class="k">נפח ק"ג</div><div class="v num">${Math.round(volOf(A)).toLocaleString('en-US')}</div></div>
   <div class="stat"><div class="k">שיאים</div><div class="v num">${f.prs.length}</div></div></div>
   ${f.prs.length?`<div class="card"><h3>שיאים אישיים חדשים</h3><ul class="tl">${f.prs.map(p=>`<li><b>${esc(p.ex.he)}</b>: ${p.cur.kind==='e1rm'?`1RM משוער <span class="num">${fmtKg(Math.round(p.cur.val*10)/10)}</span> ק"ג (קודם <span class="num">${fmtKg(Math.round(p.prev*10)/10)}</span>)`:`<span class="num">${p.cur.val}</span> ${UNIT[unitOf(p.ex)]} (קודם <span class="num">${p.prev}</span>)`}</li>`).join('')}</ul></div>`:''}
   ${f.undone?`<div class="alert"><span class="num">${f.undone}</span> סטים לא סומנו ✓ ולא יישמרו.</div>`:''}
   ${f.done?'':`<div class="alert">לא סומן אף סט, אז אין מה לשמור.</div>`}
   <button class="btn xl lane" data-act="saveWorkout" ${f.done?'':'disabled'}>שמור אימון</button>
   <button class="btn soft" data-act="close">חזרה לאימון</button>`);
}
function doSave(){
  const f=finishSummary(),w=clone(A);
  w.end=new Date().toISOString();w.dur=Math.round((Date.now()-new Date(A.date).getTime())/1000);
  w.items=w.items.map(it=>({exId:it.exId,target:it.target,rest:it.rest,sets:it.sets.filter(s=>s.done)})).filter(it=>it.sets.length);
  w.prs=f.prs.map(p=>p.ex.id);delete w.updated;
  W.unshift(w);sortW();saveWorkout(w);
  if(A.programId!=null&&A.dayIdx!=null){const p=getProg(A.programId);if(p&&A.dayIdx===(S.dayPtr[p.id]||0)%p.days.length){S.dayPtr[p.id]=(A.dayIdx+1)%p.days.length;saveState()}}
  A=null;saveActive(true);rest=null;$('#restbar').hidden=true;releaseWake();

}

function generate(goal,level,days){
  let base;const T=id=>clone(TPL.find(t=>t.id===id));
  if(goal==='home'){base=T('tpl-home3');base.days=base.days.slice(0,Math.min(days,3));if(days>3)base.days.push(...T('tpl-home3').days.slice(0,days-3).map(d=>({...d,name:d.name+' 2'})))}
  else if(goal==='run')base={days:days>=3?[...T('tpl-run2').days,T('tpl-full3').days[2]].slice(0,days):T('tpl-run2').days};
  else if(days<=2)base={days:T('tpl-full3').days.slice(0,2)};
  else if(days===3)base=goal==='hyp'?T('tpl-ppl'):T('tpl-full3');
  else if(days===4)base=T('tpl-ul4');
  else if(days===5)base={days:[...T('tpl-ul4').days,T('tpl-full3').days[2]]};
  else base={days:[...T('tpl-ppl').days,...T('tpl-ppl').days.map(d=>({...d,name:d.name+' 2'}))]};
  const MAIN=new Set(['squat','deadlift','bench','ohp','row','rdl','pullup','bss','hipthrust','frontsquat','incbench']);
  for(const d of base.days)for(const x of d.ex){const ex=exGet(x.ex);if(unitOf(ex)!=='reps')continue;const main=MAIN.has(x.ex);
    if(goal==='str'&&main){x.min=3;x.max=5;x.rest=Math.max(x.rest,180);x.sets=Math.max(x.sets,4)}
    if(goal==='hyp'){if(main){x.min=6;x.max=10}else{x.min=10;x.max=15}x.rest=main?120:75}
    if(level==='beg'){x.sets=Math.max(2,x.sets-1);if(x.min<6){x.min=6;x.max=Math.max(x.max,8)}}
    if(level==='adv'&&main)x.sets+=1}
  const Gn={hyp:'בניית שריר',str:'כוח',gen:'כושר כללי',run:'כוח לרצים',home:'בבית'},Lv={beg:'מתחיל',int:'בינוני',adv:'מתקדם'};
  const p={id:'p-'+uid(),name:`${Gn[goal]} · ${base.days.length} ימים · ${Lv[level]}`,desc:'נבנתה אוטומטית. אפשר להחליף תרגילים ולשנות סטים וחזרות.',days:base.days};
  S.programs.push(p);editId=p.id;saveState();renderPrograms();window.scrollTo({top:0});
}

/* chart */
function lineChart(points,lbl){
  if(points.length<2)return `<div class="empty" style="padding:14px">הגרף יופיע אחרי שני אימונים בתרגיל.</div>`;
  const Wd=560,H=180,pl=44,pr=14,pt=14,pb=28;
  const ys=points.map(p=>p.v);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){hi+=1;lo-=1}
  const pad=(hi-lo)*.15;lo=Math.max(0,lo-pad);hi+=pad;
  const X=i=>pl+(Wd-pl-pr)*i/(points.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const path=points.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const ticks=[lo,(lo+hi)/2,hi];
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="מגמה: ${esc(lbl)}" direction="ltr">
    ${ticks.map(t=>`<line x1="${pl}" x2="${Wd-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)"/><text x="${pl-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(t)}</text>`).join('')}
    <path d="${path} L${X(points.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z" fill="var(--track)" opacity=".12"/>
    <path d="${path}" fill="none" stroke="var(--track)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===points.length-1?5:3}" fill="${i===points.length-1?'var(--track)':'var(--surface)'}" stroke="var(--track)" stroke-width="2"><title>${esc(fmtDateY(p.d))}: ${Math.round(p.v*10)/10}</title></circle>`).join('')}
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(fmtDateY(points[0].d))}</text>
    <text x="${Wd-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(fmtDateY(points[points.length-1].d))}</text></svg>`;
}

   ========================================================= */
const WT={
  upper:{he:'פלג עליון',c:'var(--c-up)'},
  lower:{he:'פלג תחתון',c:'var(--c-low)'},
  full:{he:'גוף מלא',c:'var(--c-full)'},
  cardio:{he:'ריצה ואירובי',c:'var(--c-cardio)'},
  other:{he:'ניידות ואחר',c:'var(--c-other)'}
};
const WT_ORDER=['upper','lower','full','cardio','other'];
const ACTS={
  run:{he:'ריצה',cat:'cardio',dist:true},
  walk:{he:'הליכה',cat:'cardio',dist:true},
  bike:{he:'אופניים',cat:'cardio',dist:true},
  swim:{he:'שחייה',cat:'cardio',dist:true},
  circuit:{he:'אימון מעגלים',cat:'cardio'},
  yoga:{he:'יוגה ומתיחות',cat:'other'},
  sport:{he:'ספורט',cat:'other'},
  other:{he:'אחר',cat:'other'}
};
const UPPER_G=new Set([G.CH,G.BK,G.SH,G.BI,G.TR,'ידיים']);
const LOWER_G=new Set([G.QD,G.HM,G.GL,G.CF,'רגליים']);
const HIIT_IDS=new Set(['burpee','boxjump','thruster','jacks','slam','mountain','jumpsquat','kbswing']);
function typeOfList(list){ // list of {exId,n}
  let up=0,low=0,hiit=0,core=0;
  for(const {exId,n} of list){const ex=exGet(exId);
    if(HIIT_IDS.has(exId))hiit+=n;else if(UPPER_G.has(ex.m))up+=n;else if(LOWER_G.has(ex.m))low+=n;else core+=n}
  const tot=up+low+hiit+core;if(!tot)return 'other';
  if(hiit/tot>=.5)return 'cardio';
  if(up+low===0)return 'full';
  if(up/(up+low)>=.75)return 'upper';
  if(low/(up+low)>=.75)return 'lower';
  return 'full'}
function wType(w){if(w.kind==='activity')return (ACTS[w.act]||ACTS.other).cat;return typeOfList(w.items.map(it=>({exId:it.exId,n:it.sets.length})))}
const dayType=d=>typeOfList(d.ex.map(x=>({exId:x.ex,n:x.sets})));
const tdot=t=>`<i class="tdot" style="background:${WT[t].c}" aria-hidden="true"></i>`;
function wTitle(w){return w.kind==='activity'?(ACTS[w.act]||ACTS.other).he:(w.dayName||'אימון')}
function wMeta(w){
  if(w.kind==='activity')return [fmtDur(w.dur||0),w.dist?`${fmtKg(w.dist)} ק"מ`:'',w.rpe?`מאמץ ${w.rpe}/10`:''].filter(Boolean).join(' · ');
  return `${fmtDur(w.dur||0)} · ${setsOf(w)} סטים · ${Math.round(volOf(w)).toLocaleString('en-US')} ק"ג`}
const dkey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};

/* =========================================================
   Year grid (one square per day, colored by workout type)
   ========================================================= */
let yYear=new Date().getFullYear(),yFilter=null,ySel=null;
function dayMap(){const m={};for(const w of W){const k=dkey(w.date);(m[k]=m[k]||[]).push(w)}return m}
function yearGrid(opts){
  const map=dayMap(),now=new Date(),todayK=dkey(now);
  let start,end;
  if(opts.weeks){end=new Date(now);end.setDate(end.getDate()+(6-end.getDay()));start=new Date(end);start.setDate(start.getDate()-opts.weeks*7+1)}
  else{start=new Date(opts.year,0,1);start.setDate(start.getDate()-start.getDay());end=new Date(opts.year,11,31);end.setDate(end.getDate()+(6-end.getDay()))}
  const cs=opts.cell||13,gap=3,lx=18,ty=16;
  const nW=Math.round((end-start)/864e5/7)+1;
  const Wd=lx+nW*(cs+gap),hasGoals=!!weeklyTargets(),H=ty+7*(cs+gap)+(hasGoals?8:0);
  let cells='',months='',lastM=-1,tx=Wd;
  for(let c=0;c<nW;c++){
    if(hasGoals){const ws=new Date(start);ws.setDate(start.getDate()+c*7);if(ws<=now&&goalsMet(ws)){const x=lx+c*(cs+gap);cells+=`<rect x="${x}" y="${ty+7*(cs+gap)+1}" width="${cs}" height="5" rx="2" fill="var(--good)"><title>${esc('שבוע '+fmtDateY(ws)+': היעד השבועי הושג')}</title></rect>`}}
    for(let r=0;r<7;r++){
    const d=new Date(start);d.setDate(start.getDate()+c*7+r);
    const inYear=opts.weeks||d.getFullYear()===opts.year;if(!inYear)continue;
    const k=dkey(d),x=lx+c*(cs+gap),y=ty+r*(cs+gap),ws=map[k]||[],fut=d>now;
    if(r===0||d.getDate()===1){if(d.getMonth()!==lastM&&d.getDate()<=7){lastM=d.getMonth();months+=`<text x="${x}" y="11" font-size="10" fill="var(--muted)" font-family="Assistant, sans-serif" font-weight="700">${HMON[d.getMonth()]}</text>`}}
    let types=[...new Set(ws.map(wType))];if(yFilter)types=types.filter(t=>t===yFilter);
    const tip=`${fmtDate(d)}${ws.length?': '+ws.map(w=>wTitle(w)).join(', '):''}`;
    let inner;
    if(!types.length)inner=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="var(--sunk)"${fut?' opacity=".45"':''}/>`;
    else if(types.length===1)inner=`<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${WT[types[0]].c}"/>`;
    else inner=`<path d="M${x+3} ${y}H${x+cs}V${y+cs-3}Z" fill="${WT[types[0]].c}"/><path d="M${x} ${y+3}V${y+cs}H${x+cs-3}Z" fill="${WT[types[1]].c}"/><rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="none" stroke="${WT[types[0]].c}" stroke-width="1"/>`;
    if(k===todayK)tx=x;
    const ring=k===todayK?`<rect x="${x-1.5}" y="${y-1.5}" width="${cs+3}" height="${cs+3}" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`:'';
    const sel=k===ySel?`<rect x="${x-1.5}" y="${y-1.5}" width="${cs+3}" height="${cs+3}" rx="4" fill="none" stroke="var(--track)" stroke-width="2"/>`:'';
    cells+=`<g class="yc" data-act="ySel" data-k="${k}"><title>${esc(tip)}</title>${inner}${ring}${sel}<rect x="${x-1}" y="${y-1}" width="${cs+2}" height="${cs+2}" fill="transparent"/></g>`}}
  const dl=[1,3,5].map(r=>`<text x="0" y="${ty+r*(cs+gap)+cs-2}" font-size="10" fill="var(--muted)" font-family="Assistant, sans-serif" font-weight="700">${'אבגדהוש'[r]}</text>`).join('');
  return `<svg class="ygrid" data-tx="${tx}" width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="טבלת אימונים">${months}${dl}${cells}</svg>`;
}
const HMON=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
function yearStats(year){
  const ws=W.filter(w=>new Date(w.date).getFullYear()===year);
  const days=new Set(ws.map(w=>dkey(w.date)));
  const byT={};WT_ORDER.forEach(t=>byT[t]=0);ws.forEach(w=>byT[wType(w)]++);
  // longest run of consecutive weeks with any training, within year
  const wk=new Set(ws.map(w=>weekStart(new Date(w.date)).getTime()));let best=0,cur=0;
  const s=weekStart(new Date(year,0,1));for(let t=s.getTime();t<=new Date(year,11,31).getTime();t+=7*864e5){if(wk.has(t)){cur++;best=Math.max(best,cur)}else cur=0}
  const now=new Date(),weeksElapsed=Math.max(1,Math.ceil(((year===now.getFullYear()?now:new Date(year,11,31))-new Date(year,0,1))/864e5/7));
  let goalWeeks=0;if(weeklyTargets())for(let t=s.getTime();t<=Math.min(Date.now(),new Date(year,11,31).getTime());t+=7*864e5){if(goalsMet(new Date(t)))goalWeeks++}
  return {count:ws.length,days:days.size,byT,bestWeeks:best,perWeek:ws.length/weeksElapsed,goalWeeks}}
function yearCard(){
  const st=yearStats(yYear),minY=W.length?Math.min(...W.map(w=>new Date(w.date).getFullYear())):yYear,curY=new Date().getFullYear();
  const sel=ySel&&dayMap()[ySel];
  return `<div class="card stack" id="yearCard">
    <div class="between"><h3>טבלת האימונים · <span class="num">${yYear}</span></h3>
      <div class="row" style="gap:6px"><button class="ibtn" data-act="yNav" data-d="-1" aria-label="שנה קודמת" ${yYear<=Math.min(minY,curY)?'disabled':''}>›</button><button class="ibtn" data-act="yNav" data-d="1" aria-label="שנה הבאה" ${yYear>=curY?'disabled':''}>‹</button></div></div>

/* =========================================================
   Focused workouts: two muscle groups per session
   ========================================================= */
const MG={
  chest:{he:'חזה',w:3,s:['hPush','iPush','chestIso','hPush','chestIso']},
  back:{he:'גב',w:3,s:['vPull','hPull','hPull','rearDelt','vPull']},
  shoulders:{he:'כתפיים',w:2,s:['vPush','latRaise','rearDelt','latRaise','vPush']},
  biceps:{he:'יד קדמית',w:1,s:['bi','bi','bi','bi']},
  triceps:{he:'יד אחורית',w:1,s:['tri','tri','tri','tri']},
  arms:{he:'ידיים',w:2,s:['bi','tri','bi','tri','bi','tri']},
  legs:{he:'רגליים',w:3,s:['squatP','lungeP','quadIso','calf','squatP']},
  glutes:{he:'ישבן וירך אחורית',w:3,s:['hingeP','glute','hamIso','glute','hamIso']},
  core:{he:'בטן',w:1,s:['core','core','core','core']}
};
const MG_ORDER=['chest','back','shoulders','biceps','triceps','arms','legs','glutes','core'];
const PAIRS=[
  ['chest_tri','chest','triceps'],['back_bi','back','biceps'],['legs_sh','legs','shoulders'],['chest_back','chest','back'],
  ['sh_arms','shoulders','arms'],['legs_glutes','legs','glutes'],['legs_core','legs','core'],['chest_sh','chest','shoulders'],['glutes_core','glutes','core']
];
const PAIRM=Object.fromEntries(PAIRS.map(([id,a,b])=>[id,[a,b]]));
const pairLabel=(a,b)=>`${MG[a].he} + ${MG[b].he}`;
const DEFAULT_PAIRS={2:['chest_back','legs_sh'],3:['chest_tri','back_bi','legs_sh'],4:['chest_tri','back_bi','legs_glutes','sh_arms'],
  5:['chest_tri','back_bi','legs_core','sh_arms','legs_glutes'],6:['chest_tri','back_bi','legs_core','sh_arms','chest_back','legs_glutes']};
const DEF_PROF={goal:'gen',level:'2',equip:['gym'],limits:[],style:[],focus:[]};

/* build one two-group session from the database, respecting the user's profile */
const MG_M={chest:[G.CH],back:[G.BK],shoulders:[G.SH],biceps:[G.BI],triceps:[G.TR],arms:[G.BI,G.TR],legs:[G.QD,G.CF],glutes:[G.HM,G.GL],core:[G.AB]};
function pickIn(sl,g,p,usedDay,uses){
  const inG=ex=>MG_M[g].includes(ex.m);
  const order=c=>c.map((ex,i)=>({ex,sc:i+(uses[ex.id]||0)*3+(bwOnlyStyle(p)&&!ex.bw?4:0)})).sort((a,b)=>a.sc-b.sc).map(o=>o.ex);
  const slotC=(SLOTS[sl]||[]).map(id=>EXM[id]).filter(Boolean).filter(inG);
  const poolC=EX.filter(inG).sort((a,b)=>(a.iso?1:0)-(b.iso?1:0));
  for(const cands of [slotC,poolC])for(const relax of [false,true]){const ok=order(cands.filter(ex=>!usedDay.has(ex.id)&&eligible(ex,p,relax)));if(ok.length)return ok[0]}
  return null}
function buildPairDay(ga,gb,p,N,uses,opt){opt=opt||{};
  p=p||DEF_PROF;uses=uses||{};
  let A=ga,B=gb;if(MG[B].w>MG[A].w){A=gb;B=ga}
  const wa=MG[A].w,wb=MG[B].w;let na=Math.max(1,Math.round(N*wa/(wa+wb))),nb=N-na;if(nb<1){nb=1;na=N-1}
  const usedDay=new Set(),take=(g,n)=>{const out=[];for(const sl of MG[g].s.concat(MG[g].s,MG[g].s)){if(out.length>=n)break;const e=pickIn(sl,g,p,usedDay,uses);if(e){usedDay.add(e.id);out.push([sl,e,g])}}return out};
  let la=take(A,na),lb=take(B,nb);
  if(la.length<na)lb=lb.concat(take(B,na-la.length));
  if(lb.length<nb)la=la.concat(take(A,nb-lb.length));
  const missing=[];if(!la.length)missing.push(A);if(!lb.length)missing.push(B);
  let seq,ssPairs=[];
  if(opt.ss){seq=[];for(let i=0;i<Math.max(la.length,lb.length);i++){if(la[i]&&lb[i]){seq.push(la[i],lb[i]);ssPairs.push(seq.length-2)}else{if(la[i])seq.push(la[i]);if(lb[i])seq.push(lb[i])}}}
  else if(wa===wb){seq=[];for(let i=0;i<Math.max(la.length,lb.length);i++){if(la[i])seq.push(la[i]);if(lb[i])seq.push(lb[i])}}
  else seq=la.concat(lb);
  const rx=RX[p.goal]||RX.gen,seenMain={};
  const ex=seq.map(([sl,e,g])=>{uses[e.id]=(uses[e.id]||0)+1;
    const main=MAIN_SLOTS.has(sl)&&!e.iso&&!seenMain[g];if(main)seenMain[g]=1;
    let [sets,min,max,rest]=main?rx.main:rx.acc;
    const u=unitOf(e);if(u==='sec'){min=30;max=45;rest=Math.min(rest,60)}if(u==='m'){min=30;max=40;rest=90}
    if(+p.level===1){sets=Math.max(2,sets-1);if(u==='reps'&&main&&min<6){min=6;max=Math.max(max,8)}}
    return E(e.id,sets,min,max,rest)});
  ssPairs.forEach((i,k)=>{const id='s'+(k+1);ex[i].ss=id;ex[i+1].ss=id;const r=Math.max(ex[i].rest,ex[i+1].rest);ex[i].rest=r;ex[i+1].rest=r;const s=Math.max(ex[i].sets,ex[i+1].sets);ex[i].sets=s;ex[i+1].sets=s});
  const d={name:pairLabel(ga,gb)+(opt.ss?' · סופר-סטים':''),ex};if(missing.length)d.missing=missing;return d}
function estMin(d){const seen=new Set();let s=0;d.ex.forEach((x,i)=>{if(x.ss){if(seen.has(x.ss))return;seen.add(x.ss);const y=d.ex.find((z,j)=>j!==i&&z.ss===x.ss);s+=x.sets*(80+x.rest)}else s+=x.sets*(40+x.rest)});return Math.round(s/60)}
function buildPairsProgram(p){
  const days=+p.days||3,N={30:4,45:5,60:6,75:7}[p.mins]||5;
  let ids=(p.pairs&&p.pairs.length?p.pairs:DEFAULT_PAIRS[days]||DEFAULT_PAIRS[3]).filter(id=>PAIRM[id]);
  const list=[];for(let i=0;i<days;i++)list.push(ids[i%ids.length]);
  const uses={},seen={};
  const out=list.map(id=>{const [a,b]=PAIRM[id];const d=buildPairDay(a,b,p,N,uses);seen[id]=(seen[id]||0)+1;if(seen[id]>1)d.name+=' '+seen[id];return d});
  return {split:list,days:out,N,pairs:true}}

/* ---------- focused workout sheet ---------- */
let fz={groups:['chest','triceps'],mins:'45',seed:0,ss:false};
function fzBuild(){const p=S.profile||DEF_PROF,N={30:4,45:5,60:6,75:7}[fz.mins]||5;
  const uses={};if(fz.seed){[...new Set(Object.values(SLOTS).flat())].forEach(id=>uses[id]=Math.random()*1.4)}
  return buildPairDay(fz.groups[0],fz.groups[1],p,N,uses,{ss:fz.ss})}
function openFocus(a,b){if(a&&b)fz.groups=[a,b];fz.seed=0;fz.day=null;drawFocus()}
function drawFocus(){
  const ok=fz.groups.length===2;if(ok&&!fz.day)fz.day=fzBuild();
  const d=ok?fz.day:null,mins=d?estMin(d):0;
  let saved=0;if(d&&fz.ss){const plain=buildPairDay(fz.groups[0],fz.groups[1],S.profile||DEF_PROF,d.ex.length,{});saved=Math.max(0,estMin(plain)-mins)}
  const userProg=S.programs.find(x=>x.id===S.activeProgramId);
  openSheet(`<div class="shead"><div class="tt"><div class="eyebrow">אימון ממוקד</div><h2>${ok?esc(pairLabel(fz.groups[0],fz.groups[1])):'בחר 2 קבוצות שריר'}</h2></div><button class="ibtn" data-act="close" aria-label="סגור">✕</button></div>
   <div class="scroller" role="group" aria-label="צמדים מוכנים">${PAIRS.map(([id,a,b])=>`<button class="pill sm" data-act="fzPair" data-a="${a}" data-b="${b}" aria-pressed="${fz.groups[0]===a&&fz.groups[1]===b}">${esc(pairLabel(a,b))}</button>`).join('')}</div>
   <div><div class="fld" style="margin-bottom:6px">או בחר בעצמך (${fz.groups.length}/2)</div>
   <div class="qopts g3">${MG_ORDER.map(g=>`<button class="qopt sm" data-act="fzG" data-g="${g}" aria-pressed="${fz.groups.includes(g)}">${fz.groups.includes(g)?`<span class="num chip t">${fz.groups.indexOf(g)+1}</span>`:''}${esc(MG[g].he)}</button>`).join('')}</div></div>
   <div><div class="fld" style="margin-bottom:6px">זמן</div><div class="qopts g4">${['30','45','60','75'].map(m=>`<button class="qopt sm num" data-act="fzMin" data-m="${m}" aria-pressed="${fz.mins===m}">${m}${m==='75'?'+':''} דק׳</button>`).join('')}</div></div>
   <button class="qopt sm" data-act="fzSS" aria-pressed="${fz.ss}"><span><b>סופר-סטים</b><small>תרגיל מכל קבוצה ברצף, בלי מנוחה ביניהם${saved?` · חוסך כ-${saved} דק׳`:''}</small></span><i class="qchk" aria-hidden="true">✓</i></button>
   ${d&&d.missing?`<div class="alert">אין תרגילי ${d.missing.map(g=>MG[g].he).join(' ו')} שמתאימים לציוד ולמגבלות ${S.profile?'שבחרת בשאלון':'הנוכחיים'}. האימון בנוי מהקבוצה השנייה בלבד.</div>`:''}
   ${d?`<div class="card"><div class="between"><b>${tdot(dayType(d))}${d.ex.length} תרגילים · ~${mins} דק׳</b><button class="btn soft sm" data-act="fzShuffle">⇄ ערבב תרגילים</button></div>
     <ul class="exl" style="margin-top:4px">${d.ex.map(x=>{const ex=exGet(x.ex);return `<li${x.ss?` class="ssli"`:''}>${x.ss?`<span class="sstag num">${x.ss.slice(1)}</span>`:''}<button class="th" data-act="detail" data-id="${x.ex}" aria-label="${esc(ex.he)}" style="border:0;padding:0;cursor:pointer">${thumb(ex)}</button><span class="nm">${esc(ex.he)}<small>${esc(ex.m)}</small></span><span class="rx">${rxLabel(x,ex)}</span></li>`}).join('')}</ul>
     <p class="note" style="margin:8px 0 0">${S.profile?'נבנה לפי הציוד, הרמה והמגבלות מהשאלון שלך.':'נבנה לחדר כושר מלא ורמה בינונית. מלא את שאלון המטרות כדי להתאים לציוד ולמגבלות שלך.'}</p></div>
   <button class="btn xl" data-act="fzStart">התחל אימון ממוקד</button>
   <button class="btn soft" data-act="fzSave">${userProg?`הוסף כיום ל"${esc(userProg.name)}"`:'שמור בתוכנית "אימונים ממוקדים"'}</button>`:`<div class="empty">בחר צמד מוכן או שתי קבוצות שריר כדי לראות את האימון.</div>`}`)}
function lastTrainedDays(g){const ms=MG_M[g];for(const w of W){if(w.kind==='activity')continue;if(w.items.some(it=>ms.includes(LEGACY_G[exGet(it.exId).m]||exGet(it.exId).m)&&it.sets.some(s=>s.done)))return Math.floor((Date.now()-new Date(w.date))/864e5)}return Infinity}
function recPair(){let best=null;for(const [id,a,b] of PAIRS){const s=Math.min(lastTrainedDays(a),lastTrainedDays(b));if(!best||s>best.s)best={id,a,b,s}}return best}
function focusCard(){
  const r=recPair(),rest=PAIRS.filter(p=>p[0]!==r.id);
  const why=r.s===Infinity?'עוד לא אימנת אותן':`לא אימנת ${r.s} ימים`;

   <div class="scroller" role="group" aria-label="צמדים מוכנים">${rest.slice(0,7).map(([id,a,b])=>`<button class="pill" data-act="focusPair" data-a="${a}" data-b="${b}">${esc(pairLabel(a,b))}</button>`).join('')}</div></div>`}

/* =========================================================
   1) Program review every 4 weeks
   ========================================================= */
const REVIEW_DAYS=28;
function progMeta(id){S.progMeta=S.progMeta||{};if(!S.progMeta[id]){
  const ws=W.filter(w=>w.programId===id);const first=ws.length?ws[ws.length-1].date:new Date().toISOString();
  S.progMeta[id]={start:first}}return S.progMeta[id]}
function reviewSince(id){const m=progMeta(id);return new Date(m.lastReview||m.start)}
function reviewDue(){const p=getProg(S.activeProgramId);if(!p)return null;const since=reviewSince(p.id);
  const days=(Date.now()-since)/864e5,n=W.filter(w=>w.programId===p.id&&new Date(w.date)>=since).length;
  if(m_snooze(p.id))return null;
  return days>=REVIEW_DAYS&&n>=4?{p,since,n}:null}
function m_snooze(id){const m=progMeta(id);return m.snooze&&Date.now()<new Date(m.snooze).getTime()}
function altFor(exId,day,p){
  const prof=S.profile||DEF_PROF,slot=Object.keys(SLOTS).find(k=>SLOTS[k].includes(exId));
  const used=new Set(day.ex.map(x=>x.ex));const uses={[exId]:99};
  let e=slot?pickFor(slot,prof,used,uses):null;
  if(!e||e.id===exId){const g=exGet(exId).m;e=EX.find(x=>x.m===g&&x.id!==exId&&!used.has(x.id)&&eligible(x,prof,true))||null}
  return e&&e.id!==exId?e:null}
function analyzeProgram(p,since){
  const out=[],seen=new Set();let steady=0;
  p.days.forEach((d,di)=>d.ex.forEach((x,xi)=>{if(seen.has(x.ex))return;seen.add(x.ex);
    const ex=exGet(x.ex),h=history(x.ex).filter(s=>new Date(s.date)>=since).reverse();
    const base={di,xi,exId:x.ex,name:ex.he,day:d.name};
    if(!h.length){const alt=altFor(x.ex,d,p);out.push({...base,kind:'unused',title:'לא בוצע ב-4 השבועות האחרונים',text:alt?`להחליף ל${alt.he}?`:'כדאי להחליף או להסיר.',action:alt?'swap':null,alt:alt&&alt.id});return}
    const vals=h.map(s=>sessionBest(s.sets,ex).val),first=vals[0],last=vals[vals.length-1],chg=first?(last-first)/first:0;
    const lastSets=h[h.length-1].sets,hitTop=lastSets.length>=x.sets&&lastSets.every(s=>+s.reps>=x.max);
    const unitTxt=sessionBest(h[0].sets,ex).kind==='e1rm'?'1RM':UNIT[unitOf(ex)];
    const trend=`${unitTxt} ${fmtKg(Math.round(first*10)/10)} ← ${fmtKg(Math.round(last*10)/10)}`;
    if(h.length>=3&&chg<.01&&!hitTop){const alt=altFor(x.ex,d,p);out.push({...base,kind:'plateau',title:`תקוע ב-${h.length} אימונים`,text:`${trend}. ${alt?`החלפה ל${alt.he} תיתן גירוי חדש.`:''}`,action:alt?'swap':null,alt:alt&&alt.id})}

const PG_TYPES={

const bodyLatest=k=>{const b=(S.body||[]).filter(x=>x[k]!=null&&x[k]!=='');return b.length?b[b.length-1]:null};
function runBest(dist){let best=null;W.forEach(w=>{if(w.kind==='activity'&&w.act==='run'&&+w.dist>=dist&&w.dur){const t=w.dur/w.dist*dist;if(best==null||t<best)best=t}});return best}
function pgCurrent(g){
  if(PG_TYPES[g.type].body){const b=bodyLatest(PG_TYPES[g.type].body);return b?+b[PG_TYPES[g.type].body]:null}
  if(g.type==='lift'){const r=exRecords(g.exId);return r&&r.bestE?Math.round(r.bestE*10)/10:null}
  if(g.type==='reps'){const r=exRecords(g.exId);return r?r.maxReps:null}
  if(g.type==='run')return runBest(g.dist)}
const pgFmt=(g,v)=>v==null?'—':g.type==='run'?fmtDur(v):`${fmtKg(v)} ${PG_TYPES[g.type].unit}`;
function pgTitle(g){if(g.type==='lift'||g.type==='reps')return `${PG_TYPES[g.type].he}: ${exGet(g.exId).he}`;if(g.type==='run')return `ריצת ${fmtKg(g.dist)} ק"מ`;return PG_TYPES[g.type].he}
function pgProgress(g){const cur=pgCurrent(g);if(cur==null)return {cur,pct:0,done:false};
  const st=g.start!=null?g.start:cur,tg=+g.target,dir=PG_TYPES[g.type].dir,down=dir<0||(dir===0&&tg<st);
  const done=down?cur<=tg:cur>=tg;const span=Math.abs(tg-st)||1;const pct=Math.max(0,Math.min(1,(down?st-cur:cur-st)/span));return {cur,pct:done?1:pct,done}}

  const since=Date.now()-56*864e5;let pts=[];

  else if(g.type==='lift'||g.type==='reps'){const ex=exGet(g.exId);pts=history(g.exId).filter(s=>new Date(s.date)>=since).map(s=>[new Date(s.date).getTime(),sessionBest(s.sets,ex).val])}

  const slope=pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/(pts.reduce((a,p)=>a+(p[0]-mx)**2,0)||1);
