    dyn.forEach(fn=>fn(J))};
  return {scene,camera,update,setCam,theta0:P.front?1.15:.5}
}

/* ---------- thumbnails (rendered once to images) ---------- */
function thumbKey(ex){return (ex.pat||'x')+'|'+(ex.imp||'')}
function t3thumbURL(key){
  const k2=key+'|'+(isDarkUI()?'d':'l')+cssVar('--track');if(T3.cache[k2])return T3.cache[k2];
  if(!T3.tr){T3.tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});T3.tr.setPixelRatio(1);T3.tr.setSize(144,144,false)}
  const [pat,imp]=key.split('|');const sc=buildScene3D({pat,imp:imp||undefined});sc.update(1);sc.camera.aspect=1;sc.camera.updateProjectionMatrix();sc.setCam(sc.theta0,.2,375);
  T3.tr.clear();T3.tr.render(sc.scene,sc.camera);const url=T3.tr.domElement.toDataURL('image/png');T3.cache[k2]=url;return url}
function hydrate3D(){
  if(!t3init())return;
  const els=$$('.t3:not([data-done])');if(!els.length)return;
  const keys=[...new Set(els.map(e=>e.dataset.k))];
  let i=0;const step=()=>{const t0=performance.now();
    while(i<keys.length&&performance.now()-t0<12){const k=keys[i++];if(!PAT[k.split('|')[0]])continue;
      try{const url=t3thumbURL(k);$$(`.t3[data-k="${k}"]:not([data-done])`).forEach(el=>{el.dataset.done='1';el.innerHTML=`<img src="${url}" alt="" draggable="false">`})}catch(e){console.warn('3d thumb',e)}}
    if(i<keys.length)requestAnimationFrame(step)};
  requestAnimationFrame(step)}
let _hydT=null;
new MutationObserver(()=>{if(_hydT)return;_hydT=requestAnimationFrame(()=>{_hydT=null;hydrate3D()})}).observe(document.body,{childList:true,subtree:true});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{$$('.t3[data-done]').forEach(e=>{e.removeAttribute('data-done')});hydrate3D()});

/* ---------- live, rotatable detail view ---------- */
function startAnim3D(el,ex){
  const sc=buildScene3D(ex);
  if(!T3.dr){T3.dr=new THREE.WebGLRenderer({antialias:true,alpha:true})}
  const R=T3.dr,cv=R.domElement;el.innerHTML='';el.appendChild(cv);cv.style.width='100%';cv.style.height='100%';cv.style.touchAction='none';cv.style.cursor='grab';cv.setAttribute('aria-label','3D view: drag to rotate');cv.setAttribute('role','img');
  const w=el.clientWidth||280;R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.setSize(w,w,false);sc.camera.aspect=1;sc.camera.updateProjectionMatrix();
  const st={el,ex,is3d:true,playing:!reduceMotion,start:performance.now(),raf:0,t:reduceMotion?1:0,theta:sc.theta0,phi:.22};
  const draw=()=>{sc.update(st.t);sc.setCam(st.theta,st.phi);R.render(sc.scene,sc.camera)};
  st.setT=t=>{st.t=t;draw()};
  st.setView=v=>{st.theta={side:0,front:Math.PI/2,q:sc.theta0,back:-Math.PI*.75}[v];st.phi=v==='top'?.9:.22;if(!st.playing)draw()};
  st.tick=now=>{if(!st.playing)return;const ph=((now-st.start)/2800)%1;const u=ph<.12?0:ph<.5?(ph-.12)/.38:ph<.62?1:1-(ph-.62)/.38;st.t=(1-Math.cos(Math.PI*u))/2;draw();st.raf=requestAnimationFrame(st.tick)};
  let drag=null;
  const down=e=>{drag={x:e.clientX,y:e.clientY,th:st.theta,ph:st.phi};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
  const move=e=>{if(!drag)return;st.theta=drag.th-(e.clientX-drag.x)*.012;st.phi=Math.max(-.05,Math.min(1.1,drag.ph+(e.clientY-drag.y)*.008));if(!st.playing)draw()};
  const up=()=>{drag=null;cv.style.cursor='grab'};
  cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  st.cleanup=()=>{cv.removeEventListener('pointerdown',down);cv.removeEventListener('pointermove',move);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up)};
  draw();if(st.playing)st.raf=requestAnimationFrame(st.tick);
  anim=st;
}

    <p class="note" style="text-align:center;margin:0">One-time sign-up, no verification code.</p>`;return}
  if(onb.step==='signup'){const e=onb.err;el.innerHTML=`
    <div class="onb-steps"><span class="on">1 · Details</span><span>2 · Goals questionnaire</span></div>
    <div><h2 style="font-size:1.7rem">Nice to meet you</h2><p class="note" style="margin:4px 0 0">Just once. After that you go straight into the app.</p></div>
    <form id="onbForm" class="stack" novalidate>
      <label class="fld" for="onbName">Username<input id="onbName" autocomplete="nickname" maxlength="30" value="${esc(onb.name)}" placeholder="What should we call you?" class="big3">${e.name?`<span class="ferr">${esc(e.name)}</span>`:''}</label>
      <label class="fld" for="onbPhone">Phone number<input id="onbPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" value="${esc(onb.phone)}" placeholder="050-1234567" class="big3 num">${e.phone?`<span class="ferr">${esc(e.phone)}</span>`:''}</label>
      <p class="note" style="margin:0">No SMS, no code. Your details are stored only in your private record in the app.</p>
      <button class="btn xl" type="submit">Continue to questionnaire</button>
    </form>`;
    $('#onbForm').addEventListener('submit',ev=>{ev.preventDefault();onbSubmit()});
    setTimeout(()=>{try{$('#onbName').focus()}catch(_){}},60)}
}
function onbSubmit(){
  onb.name=$('#onbName').value.trim();onb.phone=$('#onbPhone').value.trim();onb.err={};
  if(!nameOk(onb.name))onb.err.name='Name must be 2 to 30 characters.';
  if(!phoneOk(onb.phone))onb.err.phone='Invalid number. Example: 050-1234567.';
  if(onb.err.name||onb.err.phone){drawOnb();return}
  S.user={name:onb.name,phone:fmtPhone(onb.phone),joined:new Date().toISOString()};saveState();
  hideOnb();renderAll();
  if(!S.profile){openQuiz();toast(`Welcome, ${S.user.name}! Two more minutes and you'll have a program.`)}
  else toast(`Welcome, ${S.user.name}!`)}
function userGate(){if(S.user){hideOnb();renderAll();return}showOnb('welcome')}

/* account card in the goals tab */
function userCard(){if(!S.user)return '';const u=S.user;
  return `<div class="card between"><div class="row" style="gap:12px;flex-wrap:nowrap;min-width:0"><span class="avatar" aria-hidden="true">${esc(u.name.trim().charAt(0))}</span><div style="min-width:0"><b>${esc(u.name)}</b><div class="note num" style="direction:ltr;text-align:left">${esc(u.phone)}</div><div class="note">Joined ${esc(fmtDateY(u.joined))}</div></div></div><button class="btn soft sm" data-act="userEdit">Edit details</button></div>`}
function openUserEdit(){const u=S.user||{};onb.err={};
  openSheet(`<div class="shead"><div class="tt"><h2>My details</h2></div><button class="ibtn" data-act="close" aria-label="Close">✕</button></div>
   <label class="fld" for="ueName">Username<input id="ueName" maxlength="30" value="${esc(u.name||'')}" class="big3"></label>
   <label class="fld" for="uePhone">Phone number<input id="uePhone" type="tel" inputmode="tel" dir="ltr" value="${esc(u.phone||'')}" class="big3 num"></label>
   <div id="ueErr" class="ferr"></div>
   <button class="btn xl" data-act="userSave">Save</button>`)}
Object.assign(ACT,{
  onbGo:()=>showOnb('signup'),
  userEdit:()=>openUserEdit(),
  userSave:()=>{const n=$('#ueName').value.trim(),p=$('#uePhone').value.trim();
    if(!nameOk(n)){$('#ueErr').textContent='Name must be 2 to 30 characters.';return}if(!phoneOk(p)){$('#ueErr').textContent='Invalid number. Example: 050-1234567.';return}
    S.user=Object.assign({},S.user,{name:n,phone:fmtPhone(p)});saveState();closeSheet();renderAll();toast('Details saved')}
});

/* init */
renderTools();
let t0='today';try{t0=localStorage.getItem('maslul2.tab')||'today'}catch(e){}
const hsh=(location.hash||'').slice(1);if(['today','programs','lib','progress','tools'].includes(hsh))t0=hsh;
if(A)t0='today';
showTab(t0);
if(A)requestWake();
if(!S.user)showOnb('splash');
Promise.race([Cloud.init(),new Promise(r=>setTimeout(r,3500))]).then(userGate,userGate);

})();
</script>
<script>
/* =========================================================
   Install as a phone app (site build only)
   ========================================================= */
(function(){
  if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())return; // native app: no service worker, no install banner
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e))})}
  if(standalone)return;
  let dismissed=false;try{dismissed=localStorage.getItem('shellyfit.installDismissed')==='1'}catch(e){}
  if(dismissed)return;
  const bar=document.createElement('div');bar.className='installbar';bar.dir='ltr';bar.hidden=true;document.body.appendChild(bar);
  const close=()=>{bar.hidden=true;try{localStorage.setItem('shellyfit.installDismissed','1')}catch(e){}};
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
    bar.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="t"><b>Install Shelly Fit</b><span>Home-screen icon, opens without the browser</span></div><button class="btn sm" id="instGo">Install</button><button class="ibtn" id="instX" aria-label="Close">✕</button>`;
    bar.hidden=false;
    bar.querySelector('#instGo').onclick=async()=>{bar.hidden=true;deferred.prompt();try{await deferred.userChoice}catch(_){}deferred=null};
    bar.querySelector('#instX').onclick=close});
  window.addEventListener('appinstalled',()=>{bar.hidden=true;close()});
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  if(iOS){setTimeout(()=>{if(!bar.hidden)return;
    bar.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="t"><b>Add Shelly Fit to your home screen</b><span>Tap <span class="shr" aria-label="Share">⎋</span> Share, then "Add to Home Screen"</span></div><button class="ibtn" id="instX" aria-label="Close">✕</button>`;
    bar.hidden=false;bar.querySelector('#instX').onclick=close},4000)}
})();

</script>
